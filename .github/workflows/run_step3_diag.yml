name: Run H16 c99=1 Step 3 Diag

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_DIAG.py'
      - '.github/workflows/run_step3_diag.yml'
  workflow_dispatch:

jobs:
  step3-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install python-sat
      - name: Run SOLVE_C99_1_DIAG.py
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_DIAG.py
      - name: Upload Diag report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h16-c99-step3-diag
          path: research_updates/2026_11_17_h16_c99_carbon_hard/diag_c99_1_report.json
