name: H16 B0_00 K0 W_ess eta 1

on:
  push:
    branches: ['cert/k0-proved-extra-closed']
    paths: ['.github/workflows/h16_b000_k0_wess_eta1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    name: eta 1 shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy python-sat
      - name: Replay every source leaf in the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          driver=research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B000_K0_WESS_REPLAY.py
          python -u "$driver" --eta 1 --shard "$SHARD" --shards 7 --cubic-split --depth 6 --leaf-seconds 225 --seconds 830 --out cert
          # Replay every closed leaf, even when another leaf is still open.
          python -c 'import json; print(*json.load(open("cert/index.json"))["closed"], sep="\n")' > closed.txt
          mkdir -p replayed
          while read -r rb; do
            [ -n "$rb" ] || continue
            python -u "$driver" --eta 1 --rb "$rb" --cubic-split --depth 6 --seconds 275 --out "replayed/rb$rb.json" --verify "cert/rb$rb.json"
          done < closed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k0-wess-eta1-shard${{ matrix.shard }}
          path: |
            cert/
            replayed/
