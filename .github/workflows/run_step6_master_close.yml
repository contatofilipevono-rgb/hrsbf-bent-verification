name: Run H16 Step 9 8-Branch Cubic-Drop & Degree-3 Radical Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP9_8BRANCH_CUBIC_DROP.py'
      - '.github/workflows/run_step6_master_close.yml'
  workflow_dispatch:

jobs:
  step9-cubic-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_00, B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: Run SOLVE_STEP9_8BRANCH_CUBIC_DROP.py on ${{ matrix.cell }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP9_8BRANCH_CUBIC_DROP.py --cells ${{ matrix.cell }}
