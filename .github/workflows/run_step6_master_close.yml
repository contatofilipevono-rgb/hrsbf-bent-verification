name: Run H16 Step 8B Carbon-32 All-Weapons Parallel Suite

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/**'
      - '.github/workflows/run_step6_master_close.yml'
  workflow_dispatch:

jobs:
  j01-b09-dual-s-and-b29-k5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: 1. Run VERIFY_K5_BOUNDARY_C99_0.py
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/VERIFY_K5_BOUNDARY_C99_0.py
      - name: 2. Run SOLVE_B09_DUAL_S_ELIM.py (Exact Mod-4/Mod-8 Krawtchouk Dual-s Elimination)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B09_DUAL_S_ELIM.py 120

  j02-b01-223quad-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: 1. Run SOLVE_B1_223QUAD.py on B1_00 and B1_11
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B1_223QUAD.py all 240
      - name: 2. Run SOLVE_H16_FINAL_CLOSE.py on B1_00 and B1_11
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_H16_FINAL_CLOSE.py --cell B1_00 --budget 60
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_H16_FINAL_CLOSE.py --cell B1_11 --budget 240

  j03-b20-deg4-schur-c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: Run SOLVE_DEG4_SCHUR_C.py (C11 Schur-Mutant-XL Degree-4 Reducer)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_DEG4_SCHUR_C.py

  j04-b04-b05-b06-symplectic-gl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: 1. Run DIAGNOSE_V2_STRUCTURE.py (b04)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/DIAGNOSE_V2_STRUCTURE.py
      - name: 2. Run SOLVE_B05_SYMPLECTIC_KERNEL.py (b05)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B05_SYMPLECTIC_KERNEL.py
      - name: 3. Run SOLVE_B06_GL_SIMULTANEOUS_LIN.py (b06)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B06_GL_SIMULTANEOUS_LIN.py ALL

  j05-b10-b11-b12-8d-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: 1. Run SOLVE_B10_O8_DUAL.py (b10)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B10_O8_DUAL.py
      - name: 2. Run SOLVE_B11_0X3333_DUALITY.py (b11)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B11_0X3333_DUALITY.py 120
      - name: 3. Run SOLVE_B12_C16_AND_TWISTED8D.py (b12)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B12_C16_AND_TWISTED8D.py 120

  j06-b14-b17-b18-b19-algebraic-rings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: 1. Run SOLVE_B14_NILPOTENT_RING.py (b14)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B14_NILPOTENT_RING.py --cell ALL --budget 90
      - name: 2. Run SOLVE_B18_DIHEDRAL_DECOMP.py (b18)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B18_DIHEDRAL_DECOMP.py 90
      - name: 3. Run SOLVE_B19_Z16_JORDAN.py (b19)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B19_Z16_JORDAN.py all 90

  j07-b15-b16-b28-derivatives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: 1. Run SOLVE_B15_DERIVATIVE_AUTOCORR.py (b15)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B15_DERIVATIVE_AUTOCORR.py all 90
      - name: 2. Run SOLVE_B16_SECOND_DERIV_AND_CLOSE.py (b16)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B16_SECOND_DERIV_AND_CLOSE.py 120 ALL
      - name: 3. Run SOLVE_B28_FORMAL_DERIV_DEG4.py (b28)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B28_FORMAL_DERIV_DEG4.py

  j08-b03-b25-b26-b27-probing-2sat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: 1. Run SOLVE_B03_CUBIC_QUOTIENT_MOD32.py (b03)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B03_CUBIC_QUOTIENT_MOD32.py all 90
      - name: 2. Run SOLVE_ALGEBRAIC_PROBE.py (b26)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_ALGEBRAIC_PROBE.py
      - name: 3. Run PROBE_2SAT_CLOSURE.py (b27)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/PROBE_2SAT_CLOSURE.py

  j09-b07-b22-b23-b31-lazy-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: 1. Run SOLVE_ALL_REMAINING_FAST.py (b31)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_ALL_REMAINING_FAST.py
      - name: 2. Run SOLVE_LAZY_K_OF_M_MASTER.py (b22)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_LAZY_K_OF_M_MASTER.py
      - name: 3. Run SOLVE_B23_LAZY_PB_B0_11.py (b23)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B23_LAZY_PB_B0_11.py

  j10-b02-pure-python-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run VERIFY_B1_00_AND_LINEAR_PIVOTS_111.py (b02 complete)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/VERIFY_B1_00_AND_LINEAR_PIVOTS_111.py
