name: Run H16 Step 8D Focused Diagnostics & Unblocked Solvers

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/DIAGNOSE_V2_STRUCTURE.py'
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B1_223QUAD.py'
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B09_DUAL_S_ELIM.py'
      - '.github/workflows/run_step6_master_close.yml'
  workflow_dispatch:

jobs:
  d01-diagnose-v2-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: Run DIAGNOSE_V2_STRUCTURE.py (B0_00, B0_11, B1_11)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/DIAGNOSE_V2_STRUCTURE.py --cells B0_00,B0_11,B1_11 --samples 60 --flat-seeds 10

  d02-b1-223quad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: Run SOLVE_B1_223QUAD.py (B1_00 & B1_11 Schur-D4 + 223-Quad SAT)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B1_223QUAD.py all 240

  d03-b09-dual-s-elim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: Run SOLVE_B09_DUAL_S_ELIM.py (Exact Mod-4/Mod-8 Krawtchouk Dual-s Elimination)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B09_DUAL_S_ELIM.py 180
