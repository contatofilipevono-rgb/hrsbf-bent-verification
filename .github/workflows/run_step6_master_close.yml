name: Run H16 Step 14 All-128 Eta Split on CG389 + Fixed Step 12A B0_00 Normal-Bent

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP12A*.py'
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP14*.py'
      - '.github/workflows/run_step6_master_close.yml'
  workflow_dispatch:

jobs:
  step14a-eta128-split-cg389:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_00, B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install -q python-sat numpy
      - name: Run Step 14 All-128 Eta Split on CG389 for ${{ matrix.cell }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP14_ETA128_SPLIT_ON_CG389.py --cells ${{ matrix.cell }}

  step14b-fixed-b000-normal-bent-crush:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install -q python-sat numpy
      - name: Run Fixed Step 12A B0_00 Normal-Bent D8-Coset Cubics + 0xFF 102-State Split
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP12A_B0_00_NORMAL_BENT_CRUSH.py
