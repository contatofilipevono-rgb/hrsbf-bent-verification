name: Run H16 Step 15 Eta-64 -> 17+ Quad Symplectic Crush (All 3 Open Cells)

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP15*.py'
      - '.github/workflows/run_step6_master_close.yml'
  workflow_dispatch:

jobs:
  step15-eta-17quad-crush:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_00, B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install -q python-sat numpy
      - name: Run Step 15 Eta-64 -> 17+ Quad Symplectic Crush on ${{ matrix.cell }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP15_ETA_17QUAD_CRUSH.py --cells ${{ matrix.cell }}
