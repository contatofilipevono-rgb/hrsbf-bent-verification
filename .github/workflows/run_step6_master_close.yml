name: Run H16 Step 8 Carbon-32 Final Closure

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/**'
      - '.github/workflows/run_step6_master_close.yml'
  workflow_dispatch:

jobs:
  step8-b1-and-dual-s-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: 1. Run VERIFY_B1_00_AND_LINEAR_PIVOTS_111.py (Zero-Trust B1_00 & B1_11 Linear Pivot Proof)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/VERIFY_B1_00_AND_LINEAR_PIVOTS_111.py
      - name: 2. Run SOLVE_B09_DUAL_S_ELIM.py (Exact Mod-4/Mod-8 Krawtchouk Dual-s Elimination on B1_00, B1_11, B0_11)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B09_DUAL_S_ELIM.py 90
      - name: 3. Run SOLVE_B1_223QUAD.py (B1_00 & B1_11 223-Quadratic Schur-Mutant-XL + Fast SAT)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B1_223QUAD.py all 120
      - name: 4. Run SOLVE_H16_FINAL_CLOSE.py on B1_00 and B1_11
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_H16_FINAL_CLOSE.py --cell B1_00 --budget 60
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_H16_FINAL_CLOSE.py --cell B1_11 --budget 150

  step8-b0-cyclotomic-tower:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: Run SOLVE_B13_CYCLOTOMIC_TOWER_MASTER.py on all cells
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B13_CYCLOTOMIC_TOWER_MASTER.py all 180 0/1

  step8-b0-00-sharded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        job_id: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: Run 4 parallel workers of SOLVE_H16_FINAL_CLOSE.py on B0_00 (32 workers total)
        run: |
          J=${{ matrix.job_id }}
          for k in 0 1 2 3; do
            W=$(( J * 4 + k ))
            python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_H16_FINAL_CLOSE.py --cell B0_00 --worker-id $W --num-workers 32 --depth-vc 3 --budget 360 > b0_00_w${W}.log 2>&1 &
          done
          wait
          for k in 0 1 2 3; do
            W=$(( J * 4 + k ))
            echo "=== WORKER $W ==="
            cat b0_00_w${W}.log
          done

  step8-b0-11-sharded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        job_id: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install -q python-sat
      - name: Run 4 parallel workers of SOLVE_H16_FINAL_CLOSE.py on B0_11 (32 workers total)
        run: |
          J=${{ matrix.job_id }}
          for k in 0 1 2 3; do
            W=$(( J * 4 + k ))
            python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_H16_FINAL_CLOSE.py --cell B0_11 --worker-id $W --num-workers 32 --depth-vc 3 --budget 360 > b0_11_w${W}.log 2>&1 &
          done
          wait
          for k in 0 1 2 3; do
            W=$(( J * 4 + k ))
            echo "=== WORKER $W ==="
            cat b0_11_w${W}.log
          done
