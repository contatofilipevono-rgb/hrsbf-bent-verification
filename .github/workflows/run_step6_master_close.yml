name: Run H16 Step 12 Normal-Bent B0_00 Crush + Fast WalkSAT V3 & 0xFF Split

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP12*.py'
      - '.github/workflows/run_step6_master_close.yml'
  workflow_dispatch:

jobs:
  step12a-b000-normal-bent-crush:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install -q python-sat numpy
      - name: Run Step 12A B0_00 Normal-Bent D8-Coset Cubics + 0xFF 102-State Split
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP12A_B0_00_NORMAL_BENT_CRUSH.py

  step12b-fast-walksat-v3-and-ff-split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_00, B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install -q python-sat numpy
      - name: Run Step 12B Fast WalkSAT on CG12 & CG388 + 0xFF Split on ${{ matrix.cell }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP12B_FAST_WALKSAT_V3_AND_F0XFF_SPLIT.py --cells ${{ matrix.cell }}
