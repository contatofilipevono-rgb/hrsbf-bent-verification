name: Run H16 Step 17 Elimination Order (R > B > A) + Pure-45-Var Schur-D4

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP17*.py'
      - '.github/workflows/run_step6_master_close.yml'
  workflow_dispatch:

jobs:
  step17-elim-order-pure-b-schur4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_00, B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install -q python-sat numpy
      - name: Run Step 17 Elimination Order (R > B > A) + Pure-45-Var Schur-D4 on ${{ matrix.cell }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP17_ELIM_ORDER_R_GT_B_SCHUR4.py --cells ${{ matrix.cell }}
