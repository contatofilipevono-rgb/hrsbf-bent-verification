name: Run H16 Step 7 Mod-32 Rot4 Algebraic Closer

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP7_MOD32_ROT4.py'
      - '.github/workflows/run_step6_master_close.yml'
  workflow_dispatch:

jobs:
  step7-mod32-rot4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SOLVE_STEP7_MOD32_ROT4.py on B1_00, B1_11, B0_11, B0_00
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP7_MOD32_ROT4.py
