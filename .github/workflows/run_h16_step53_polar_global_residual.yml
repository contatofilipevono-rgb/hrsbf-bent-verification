name: H16 Step 53 exact branch-free residual
on:
  push:
    branches: [codex/h16-step43-specialized-kernel]
    paths: ['research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP53_POLAR_GLOBAL_RESIDUAL.py']
permissions:
  contents: read
  actions: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44570020591
          name: h16-step41-B0_11
          path: pencil
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44587467630
          name: h16-step52-left-inverse
          path: inverse
          github-token: ${{ github.token }}
      - run: python -m pip install -q numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP53_POLAR_GLOBAL_RESIDUAL.py
      - uses: actions/upload-artifact@v4
        with:
          name: h16-step53-global-residual
          path: step53_global_residual.json
