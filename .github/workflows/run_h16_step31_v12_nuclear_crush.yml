name: Run H16 Step 31 Non-Coord V12 Nuclear Crush (B1_11, B0_11, B0_00)

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP31_NONCOORD_V12_NUCLEAR_CRUSH.py'
      - '.github/workflows/run_h16_step31_v12_nuclear_crush.yml'

jobs:
  step31-v12-nuclear:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cell: [B1_11, B0_11, B0_00]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install python-sat numpy
      - name: Run Step 31 Non-Coord V12 Nuclear Crush (${{ matrix.cell }})
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP31_NONCOORD_V12_NUCLEAR_CRUSH.py --cells ${{ matrix.cell }} --n_v12 600
