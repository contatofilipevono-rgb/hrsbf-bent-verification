name: Classify the n12 quartic catalog by M-subspaces

on:
  push:
    branches: [codex/n12-m-catalog]
    paths:
      - '.github/workflows/n12_quartic_m_catalog.yml'
      - 'research_updates/2026_11_09_n12_mixed/quartic_m_catalog.py'

permissions:
  contents: read

env:
  SRC: research_updates/2026_11_09_n12_mixed

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research_updates/2026_11_09_n12_mixed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install numpy==2.2.6
      - name: Check the remaining representatives
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python "$SRC/list_quartic_outside.py" "$SRC/catalog" outside.tsv
          python "$SRC/quartic_m_catalog.py" outside.tsv report.json --shard "$SHARD" --shards 4
      - uses: actions/upload-artifact@v4
        with:
          name: n12-quartic-m-catalog-${{ matrix.shard }}
          path: report.json
          if-no-files-found: error
