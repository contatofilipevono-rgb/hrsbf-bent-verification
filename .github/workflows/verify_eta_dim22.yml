name: Verify eta dimension 22

on:
  push:
    branches: [main]
    paths:
      - 'avanco_t32/verificar_subespaco_eta_dim22.py'
      - '.github/workflows/verify_eta_dim22.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact CPU verification
        run: |
          python avanco_t32/verificar_subespaco_eta_dim22.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eta-dim22-result
          path: avanco_t32/resultado_subespaco_eta_dim22.json
          if-no-files-found: ignore
