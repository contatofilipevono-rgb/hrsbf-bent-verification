name: H(16,4) Step 50A — B0_11 & B1_11 D8-Coset Parseval + Cascade Probe

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP50A_B011_B111_COSET_PARSEVAL_AND_CASCADE.py'
      - '.github/workflows/run_h16_step50a_b011_b111_probe.yml'
  workflow_dispatch:

jobs:
  step50a:
    name: step50a (${{ matrix.cell }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP50A_B011_B111_COSET_PARSEVAL_AND_CASCADE.py --cell ${{ matrix.cell }} --etas 0,1,4,5
