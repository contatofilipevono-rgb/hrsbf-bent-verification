name: H(16,4) Step 46C-v2 — B0_00 eta=0 & eta=42 (Manual Dispatch Only)

on:
  workflow_dispatch:

jobs:
  step46c:
    name: step46c (${{ matrix.job.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "eta42_s0_of_2", mode: "eta42_deep", s: 0, n: 2 }
          - { name: "eta42_s1_of_2", mode: "eta42_deep", s: 1, n: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP46C_ETA0_LOWMEM_AND_ETA42_DEEP.py --mode ${{ matrix.job.mode }} --shard-idx ${{ matrix.job.s }} --n-shards ${{ matrix.job.n }} --workers 4 --budget-min 85 --cert-dir step46c_certs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step46c-certs-${{ matrix.job.name }}
          path: step46c_certs/
          if-no-files-found: ignore
