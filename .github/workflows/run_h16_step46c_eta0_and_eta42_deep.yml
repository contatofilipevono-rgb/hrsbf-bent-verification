name: H(16,4) Step 46C — B0_00 eta=0 Low-Mem Stream & eta=42 Deep 2-Level Closer

on:
  push:
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP46C_ETA0_LOWMEM_AND_ETA42_DEEP.py'
      - '.github/workflows/run_h16_step46c_eta0_and_eta42_deep.yml'
  workflow_dispatch:

jobs:
  step46c_b000_targeted:
    name: step46c (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [eta0_lowmem, eta42_deep]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install numpy python-sat
      - name: Run Step 46C (${{ matrix.mode }})
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP46C_ETA0_LOWMEM_AND_ETA42_DEEP.py --mode ${{ matrix.mode }} --workers 4 --budget-min 38 --cert-dir step46c_certs
      - name: Upload certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step46c-certs-${{ matrix.mode }}
          path: step46c_certs/
          if-no-files-found: ignore
