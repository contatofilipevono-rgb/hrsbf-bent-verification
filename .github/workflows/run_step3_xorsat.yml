name: Run H16 c99=1 Step 3 (XOR-SAT + Coset Cardinality)

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_XORSAT.py'
      - '.github/workflows/run_step3_xorsat.yml'

jobs:
  step3-xorsat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install python-sat
        run: pip install python-sat
      - name: Run SOLVE_C99_1_XORSAT.py
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_XORSAT.py
      - name: Upload Step 3 report
        uses: actions/upload-artifact@v4
        with:
          name: h16-c99-step3-xorsat
          path: research_updates/2026_11_17_h16_c99_carbon_hard/xorsat_c99_1_report.json
