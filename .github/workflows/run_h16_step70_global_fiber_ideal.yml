name: H16 Step 70 global B0_11 quotient-bit ideal
on:
  push:
    branches: [codex/h16-step65-mod9-cert]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP70_GLOBAL_FIBER_IDEAL.py'
      - '.github/workflows/run_h16_step70_global_fiber_ideal.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  global:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      H16_FREE_DIM: '30'
      H16_CASE: '0'
      H16_GLOBAL_SOLVER_SEC: '180'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44570020591
          name: h16-step41-B0_11
          path: pencil
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44587467630
          name: h16-step52-left-inverse
          path: inverse
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44587836638
          name: h16-step53-global-residual
          path: residual
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44590106242
          name: h16-step55-isotropic-flag
          path: flag
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44593200958
          name: h16-step59-branch-free-pivot
          path: pivot
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44594052302
          name: h16-step60-fiber-0
          path: fiber0
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44594052302
          name: h16-step60-fiber-64
          path: fiber64
          github-token: ${{ github.token }}
      - run: python -m pip install -q numpy python-sat pycryptosat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP70_GLOBAL_FIBER_IDEAL.py --cells B0_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h16-step70-global-ideal
          path: |
            step70_global_fiber_ideal.json
            step70_global_fiber_result.json
