name: Build IACR ePrint PDF (paper_h16_quartic_eprint.tex)

on:
  workflow_dispatch:

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper_h16_quartic_eprint.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-h16-quartic-eprint-pdf
          path: paper_h16_quartic_eprint.pdf
