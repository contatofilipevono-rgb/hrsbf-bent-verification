name: H16 Step 41 reduced pencil and low rank
on:
  push:
    branches: [codex/h16-step41-minrank]
permissions:
  contents: read
jobs:
  pencil:
    strategy:
      fail-fast: false
      matrix:
        cell: [B1_11, B0_11]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP41_REDUCED_MINRANK.py --cells ${{ matrix.cell }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h16-step41-${{ matrix.cell }}
          path: step41_${{ matrix.cell }}.json
