name: H(16,4) Step 43A Only — Eta-Invariance & Iterated Polar (B0_11, B1_11)

on:
  push:
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP43A_ETA_INVARIANCE_AND_ITERATED_POLAR.py'
      - '.github/workflows/run_h16_step43a_only.yml'
  workflow_dispatch:

jobs:
  step43a_b11_polar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install numpy python-sat
      - name: Run Step 43A Eta-Invariance & Iterated Polar (${{ matrix.cell }})
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP43A_ETA_INVARIANCE_AND_ITERATED_POLAR.py --cells ${{ matrix.cell }}
