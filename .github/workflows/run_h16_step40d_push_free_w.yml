name: H(16,4) Step 40D — Push FREE_W to the Limit on B0_11 (d_free=22..36) & B1_11 (rk<=24)

on:
  push:
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP40D_B011_B111_PUSH_FREE_W_TO_LIMIT.py'
      - '.github/workflows/run_h16_step40d_push_free_w.yml'
  workflow_dispatch:

jobs:
  step40d_push_free_w:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install numpy python-sat
      - name: Run Step 40D (${{ matrix.cell }})
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP40D_B011_B111_PUSH_FREE_W_TO_LIMIT.py --cells ${{ matrix.cell }}
