name: H16 Step 60C Degree-4 V13..V16 & C8-Walsh v2=5..10 XL Probe

on:
  workflow_dispatch:

jobs:
  step60c_deg4_xl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and python-sat
        run: pip install -q numpy python-sat
      - name: Run Step 60C Degree-4 & Higher-Order Walsh XL (${{ matrix.cell }})
        run: |
          python3 -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP60C_DEG4_V13_WALSH_XL.py --cell ${{ matrix.cell }}
