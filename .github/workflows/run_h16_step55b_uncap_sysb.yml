name: H16 Step 55B Uncapped SysB & Kernel-Seeded U1 Search

on:
  workflow_dispatch:

jobs:
  step55b_uncap_sysb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and python-sat
        run: pip install numpy python-sat
      - name: Run Step 55B Uncapped SysB & Kernel-Seeded U1 (${{ matrix.cell }})
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP55B_UNCAP_SYSB_AND_KERNEL_BASIS.py --cell ${{ matrix.cell }}
