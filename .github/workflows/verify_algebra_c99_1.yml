name: Verify Algebra C99=1 (Stage 1 Certificate)

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/VERIFICAR_ALGEBRA_C99_4_MACAULAY.py'
      - '.github/workflows/verify_algebra_c99_1.yml'

jobs:
  verify-algebra-c99-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Stage 4 Macaulay & Coset Factorization (VERIFICAR_ALGEBRA_C99_4_MACAULAY.py)
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/VERIFICAR_ALGEBRA_C99_4_MACAULAY.py
      - name: Upload algebra certificates
        uses: actions/upload-artifact@v4
        with:
          name: algebra-c99-4-macaulay
          path: research_updates/2026_11_17_h16_c99_carbon_hard/algebra_c99_4_macaulay.json
