name: Run H16 c99=1 Step 3F (CMS Mode C + D_0xffff 2^32 Matrix)

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_CMS_MODEC.py'
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_DFFFF_MATRIX.py'
      - '.github/workflows/run_step3_cms_dffff.yml'
  workflow_dispatch:

jobs:
  cms-modec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat & cryptominisat
        run: |
          pip install python-sat
          sudo apt-get update -qq && sudo apt-get install -y -qq cryptominisat
      - name: Generate Mode C native-XOR CNF
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_CMS_MODEC.py
      - name: Run cryptominisat5 on Mode C (60s)
        run: |
          timeout 60 cryptominisat5 --threads=4 --maxmatrixcols=5000 --maxmatrixrows=5000 research_updates/2026_11_17_h16_c99_carbon_hard/mode_c_cube0_native_xor.cnf || true

  dffff-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        slice: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run D_0xffff slice ${{ matrix.slice }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_DFFFF_MATRIX.py ${{ matrix.slice }}
      - name: Upload slice result
        uses: actions/upload-artifact@v4
        with:
          name: h16-c99-dffff-slice-${{ matrix.slice }}
          path: research_updates/2026_11_17_h16_c99_carbon_hard/dffff_slice_${{ matrix.slice }}.json
