name: Certify V1 common phase plane without catalog
on:
  push:
    branches: [codex/v1-common-phase-plane]
    paths:
      - '.github/workflows/n12_v1_common_phase_plane.yml'
      - 'research_updates/2026_11_09_n12_mixed/class129/certify_v1_common_phase_plane.py'
      - 'research_updates/2026_11_09_n12_mixed/class129/aggregate_v1_plane_coverage.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slice_rm_charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        chart: [0, 1, 14, 15, 22, 23, 24, 25, 36, 37, 42, 43, 50, 51, 128, 129, 142, 143, 152, 153, 164, 165, 170, 171, 178, 179, 188, 189]
    defaults:
      run:
        working-directory: research_updates/2026_11_09_n12_mixed/class129
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research_updates/2026_11_09_n12_mixed
      - name: Certify chart slice ${{ matrix.chart }}
        run: |
          mkdir -p slices
          python3 -u certify_v1_common_phase_plane.py --chart ${{ matrix.chart }} --output slices/chart-${{ matrix.chart }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v1-plane-slice-${{ matrix.chart }}
          path: research_updates/2026_11_09_n12_mixed/class129/slices/
          if-no-files-found: error
  aggregate:
    needs: slice_rm_charts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research_updates/2026_11_09_n12_mixed/class129
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research_updates/2026_11_09_n12_mixed
      - uses: actions/download-artifact@v4
        with:
          pattern: v1-plane-slice-*
          path: research_updates/2026_11_09_n12_mixed/class129/all-slices
          merge-multiple: true
      - name: Run full Stage 0, Stage 1 ANF, witness audit, negative test, and 256-chart coverage aggregator
        run: |
          python3 -u aggregate_v1_plane_coverage.py --slices-dir all-slices --run-all --output v1-plane-coverage-summary.json
          python3 -u certify_v1_common_phase_plane.py --core --negative-test --output v1-plane-core-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: v1-plane-coverage-summary
          path: |
            research_updates/2026_11_09_n12_mixed/class129/v1-plane-coverage-summary.json
            research_updates/2026_11_09_n12_mixed/class129/v1-plane-core-check.json
