name: H16 Step 44 exact pencils in B0_00
on:
  push:
    branches: [codex/h16-step43-specialized-kernel]
    paths: ['research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP44_B000_EXACT_PENCIL.py']
permissions:
  contents: read
jobs:
  sector:
    strategy:
      fail-fast: false
      matrix:
        eta: [0, 2, 4, 5, 42, 46]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP44_B000_EXACT_PENCIL.py --etas ${{ matrix.eta }}
