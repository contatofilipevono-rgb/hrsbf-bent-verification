name: H16 Step 62A All-40-Orbit Round-1 M1+A3+D FES Map

on:
  workflow_dispatch:

jobs:
  step62a_all40:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and python-sat
        run: pip install numpy python-sat
      - name: Run Step 62A All-20-Orbit M1+A3+D Map (${{ matrix.cell }})
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP62A_A3D_FES_ALL40_MAP.py --cell ${{ matrix.cell }}
