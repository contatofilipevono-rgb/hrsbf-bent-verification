name: Probe the common phase space in the dimension-four blocks V1 and V2 (n=12)
on:
  push:
    branches: [codex/v1-phase-plane-cert]
    paths:
      - '.github/workflows/n12_space_probe.yml'
      - 'research_updates/2026_11_09_n12_mixed/phase_plane/space_probe.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n12-space-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8                # 8 x 4 vCPU = 32 CPUs at most
      matrix:
        space: [1, 2]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: research_updates/2026_11_09_n12_mixed/phase_plane
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -u space_probe.py .. --space ${{ matrix.space }} --shard ${{ matrix.shard }}/4 --out probe-${{ matrix.space }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.space }}-${{ matrix.shard }}
          path: research_updates/2026_11_09_n12_mixed/phase_plane/probe-${{ matrix.space }}-${{ matrix.shard }}.json
  summary:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-*
          merge-multiple: true
          path: out
      - run: |
          python - <<'PY'
          import json, glob
          def rank(vs):
              piv = {}
              for v in vs:
                  while v and (v.bit_length() - 1) in piv:
                      v ^= piv[v.bit_length() - 1]
                  if v:
                      piv[v.bit_length() - 1] = v
              return piv
          for space in (1, 2):
              consts, allc, classes = set(), set(), {}
              for f in glob.glob(f'out/probe-{space}-*.json'):
                  r = json.load(open(f))
                  consts |= {int(x, 16) for x in r['constants']}
                  allc |= {int(x, 16) for x in r['all_coefficients']}
                  classes.update(r['classes'])
              pc, pa = rank(consts), rank(allc)
              print(f'space {space}: nonempty classes {len(classes)}; span of constant columns {len(pc)}; span of all ANF coefficients {len(pa)}')
              print('  constant span:', sorted(hex(v) for v in pc.values()))
              print('  full span    :', sorted(hex(v) for v in pa.values()))
              print('  classes:', {k: (v['dim'], v['const_rank'], v['all_rank']) for k, v in sorted(classes.items(), key=lambda kv: int(kv[0]))})
          PY
