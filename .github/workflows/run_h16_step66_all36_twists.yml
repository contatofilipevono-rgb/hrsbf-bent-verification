name: H16 Step 66 All 36 Twisted D8 Duals (100% of f_dual) 2-Adic Elimination

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP66_ALL36_TWISTED_D8_DUALS.py'
      - '.github/workflows/run_h16_step66_all36_twists.yml'

jobs:
  step66_all36_twists:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy python-sat
      - name: Run Step 66 All-36 Twisted D8 Duals (${{ matrix.cell }})
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP66_ALL36_TWISTED_D8_DUALS.py --cell ${{ matrix.cell }}
