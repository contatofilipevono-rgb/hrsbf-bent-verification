name: H16 Step 45 polar radical flag
on:
  push:
    branches: [codex/h16-step43-specialized-kernel]
    paths: ['research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP45_B011_POLAR_RADICAL_FLAG.py']
permissions:
  contents: read
  actions: read
jobs:
  flag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44570020591
          name: h16-step41-B0_11
          path: pencil
          github-token: ${{ github.token }}
      - run: python -m pip install -q numpy python-sat
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends singular
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP45_B011_POLAR_RADICAL_FLAG.py
