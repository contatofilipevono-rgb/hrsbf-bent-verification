name: Run H16 Step 20 Anatomy of Round-1 Proof & A(w)*r = b(w)

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP20*.py'
      - '.github/workflows/run_step20_round1_aw.yml'
  workflow_dispatch:

jobs:
  step20-round1-aw-anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_00, B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install -q python-sat numpy
      - name: Run Step 20 Anatomy of Round-1 Proof & A(w)*r = b(w) on ${{ matrix.cell }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP20_ANATOMY_OF_ROUND1_PROOF_AND_AW_SYZYGY.py --cells ${{ matrix.cell }}
