name: Lean antipodal global bridge (isolated)
on:
  push:
    branches:
      - formal/antipodal-global-completion-2026-10-14
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.15.0 with elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.15.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Confirm pinned Lean
        working-directory: formalization
        run: |
          lean --version
          lake --version
      - name: Obtain pinned Mathlib cache
        working-directory: formalization
        run: |
          lake update
          lake exe cache get
      - name: Verify existing 52-result formal kernel
        working-directory: formalization
        run: lake build
      - name: Check exact n=2 endpoint without admitted axioms
        working-directory: formalization
        run: |
          set -o pipefail
          lake env lean Antipodal/OddMultiplicity.lean | tee odd_multiplicity_axioms.log
          lake env lean -T 200000 Antipodal/Endpoint2.lean | tee endpoint2_axioms.log
          lake env lean Antipodal/DerivativeBridge.lean | tee derivative_bridge_axioms.log
          lake build Antipodal.QuadraticGauss
          lake env lean Antipodal/QuadraticRadical.lean | tee quadratic_radical_axioms.log
          lake env lean Antipodal/QuadraticPolar.lean | tee quadratic_polar_axioms.log
          lake env lean Antipodal/QuadraticGauss.lean | tee quadratic_gauss_axioms.log
          if grep -E 'sorryAx|Lean.ofReduceBool' endpoint2_axioms.log odd_multiplicity_axioms.log derivative_bridge_axioms.log quadratic_radical_axioms.log quadratic_polar_axioms.log quadratic_gauss_axioms.log; then exit 1; fi
