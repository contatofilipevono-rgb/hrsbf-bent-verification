name: H(16,4) Step 49B — B0_00 eta=0 XL80 Cleanup (6 XL_ROUNDS_EXHAUSTED pairs)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run_h16_step49b_eta0_xl80_cleanup.yml'
  workflow_dispatch:

jobs:
  step49b:
    name: step49b (${{ matrix.pair }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pair: ["1:28", "1:31", "5:60", "5:63", "6:33", "6:34"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy & PySAT
        run: python -m pip install --upgrade pip && pip install numpy python-sat
      - name: Close targeted eta=0 pair (${{ matrix.pair }}) with max_xl_rounds=80
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP46C_ETA0_LOWMEM_AND_ETA42_DEEP.py \
            --mode eta0_lowmem \
            --target-pairs "${{ matrix.pair }}" \
            --workers 4 \
            --budget-min 38 \
            --cert-dir step49b_certs
      - name: Upload Step 49B JSON Certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step49b-certs-${{ matrix.pair }}
          path: step49b_certs/
          if-no-files-found: ignore
