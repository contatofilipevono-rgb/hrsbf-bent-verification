name: H(16,4) Step 49B — B0_00 eta=0 Final 2 Pairs with Exact 65536-pt FWHT Leaf Check (ff2_55_1 & ff2_55_2)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run_h16_step49b_eta0_xl80_cleanup.yml'
  workflow_dispatch:

jobs:
  step49b:
    name: step49b (${{ matrix.item.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        item:
          - { id: "ff2_55_1", pair: "2:1" }
          - { id: "ff2_55_2", pair: "2:2" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy & PySAT
        run: python -m pip install --upgrade pip && pip install numpy python-sat
      - name: Close final eta=0 pair (${{ matrix.item.pair }}) with max_xl_rounds=80
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP46C_ETA0_LOWMEM_AND_ETA42_DEEP.py \
            --mode eta0_lowmem \
            --target-pairs "${{ matrix.item.pair }}" \
            --workers 4 \
            --budget-min 38 \
            --cert-dir step49b_certs
      - name: Upload Step 49B JSON Certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step49b-certs-${{ matrix.item.id }}
          path: step49b_certs/
          if-no-files-found: ignore
