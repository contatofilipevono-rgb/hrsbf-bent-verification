name: Project all three-orbit quintic representatives

on:
  push:
    branches: [codex/n12-three-quintic]
    paths:
      - '.github/workflows/n12_three_quintic.yml'
      - 'research_updates/2026_11_09_n12_mixed/sparse_projection.py'

permissions:
  contents: read

env:
  SRC: research_updates/2026_11_09_n12_mixed

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research_updates/2026_11_09_n12_mixed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install numpy==2.2.6
      - name: Derive exact affine reductions
        env:
          SHARD: ${{ matrix.shard }}
        run: python "$SRC/sparse_projection.py" --plan "$SRC/three-quintic-preflight.json" --shard "$SHARD" --shards 8 --output reduced.json
      - uses: actions/upload-artifact@v4
        with:
          name: n12-three-quintic-plan-${{ matrix.shard }}
          path: reduced.json
          if-no-files-found: error
