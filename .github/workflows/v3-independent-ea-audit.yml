name: V3 independent EA audit
on:
  push:
    branches:
      - v3-independent-ea-audit-20261008
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pesquisa_v2_quartic/lean
    steps:
      - uses: actions/checkout@v4
      - name: Record immutable source and toolchain
        run: |
          git rev-parse HEAD
          cat lean-toolchain
          cat lake-manifest.json | head -c 1000
      - name: Install pinned Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: |
          "$HOME/.elan/bin/lake" update --keep-toolchain
          "$HOME/.elan/bin/lake" exe cache get
      - name: Independent complete build
        run: |
          "$HOME/.elan/bin/lake" build
          "$HOME/.elan/bin/lake" env lean SeedPropertyAAudit.lean
          "$HOME/.elan/bin/lake" env lean GraphFamilyAudit.lean
          "$HOME/.elan/bin/lake" env lean GraphClassificationAudit.lean
      - name: Reject proof holes and custom axioms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path('VonoExactIndex').rglob('*.lean'))
          assert files
          for p in files:
              s = p.read_text()
              assert not re.search(r'\b(sorry|admit|axiom|unsafe)\b', s), p
          print('Checked', len(files), 'Lean modules')
          PY
