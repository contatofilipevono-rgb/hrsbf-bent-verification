name: Run H16 Step 24 Rank-2 R^2 Factor Attack + B0_00 CryptoMiniSat5 Pure-W Closure

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP24*.py'
      - '.github/workflows/run_step24_rank2_and_b000_cms5.yml'
  workflow_dispatch:

jobs:
  step24-rank2-and-cms5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_00, B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptominisat5, python-sat, and numpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          pip install -q python-sat numpy
      - name: Run Step 24 on ${{ matrix.cell }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP24_RANK2_R2_FACTOR_ATTACK_AND_B000_CMS5.py --cells ${{ matrix.cell }}
