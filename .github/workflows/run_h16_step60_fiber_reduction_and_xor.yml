name: H16 Step 60 verify and solve the residual fibers
on:
  push:
    branches: [codex/h16-step43-specialized-kernel]
    paths: ['research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP60_FIBER_REDUCTION_AND_XOR.py', '.github/workflows/run_h16_step60_fiber_reduction_and_xor.yml']
permissions:
  contents: read
  actions: read
jobs:
  fiber:
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      H16_FREE_DIM: '30'
      H16_CASE: '0'
      H16_FIBER: ${{ matrix.offset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44570020591
          name: h16-step41-B0_11
          path: pencil
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44587467630
          name: h16-step52-left-inverse
          path: inverse
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44587836638
          name: h16-step53-global-residual
          path: residual
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44590106242
          name: h16-step55-isotropic-flag
          path: flag
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          run-id: 44593200958
          name: h16-step59-branch-free-pivot
          path: pivot
          github-token: ${{ github.token }}
      - run: python -m pip install -q numpy python-sat pycryptosat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP60_FIBER_REDUCTION_AND_XOR.py --cells B0_11
      - uses: actions/upload-artifact@v4
        with:
          name: h16-step60-fiber-${{ matrix.offset }}
          path: |
            step60_fiber.json
            step60_result.json
