name: H16 Step 57A M1_Ext Isotropic Boost & DRF2 Quadratic Collapse

on:
  workflow_dispatch:

jobs:
  step57a_m1ext_drf2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and python-sat
        run: pip install numpy python-sat
      - name: Run Step 57A M1_Ext Isotropic Boost & DRF2 Collapse (${{ matrix.cell }})
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP57A_M1EXT_AND_DRF2_COLLAPSE.py --cell ${{ matrix.cell }}
