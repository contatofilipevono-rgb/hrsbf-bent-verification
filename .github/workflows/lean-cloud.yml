name: Lean H12 bounded resumable chains
on:
  push:
    branches: [build/h12-six-shards-three-chains]
    paths: ['.github/workflows/lean-cloud.yml', 'tools/parallel_lean.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lean-h12-parallel
  cancel-in-progress: false
jobs:
  chart_slice_01:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        index: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/parallel_lean.py
            research_updates/2026_10_21_revision3/H12_formal_sources.zip
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean 4.35.0 with verified digest
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Recover six completed preparation artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40009139009
          pattern: objects-common-*
          path: incoming
          merge-multiple: true
      - name: Require all six preparation blocks
        run: |
          for i in 0 1 2 3 4 5; do test -s "incoming/common-$i.tar.gz"; done
      - name: Verify at most 80 new modules and save a bounded slice
        run: python tools/parallel_lean.py chart --index ${{ matrix.index }} --max-modules 80
      - name: Preserve cumulative objects and verified progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-1-${{ matrix.index }}
          path: artifacts/chart-*.tar.gz
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-1-${{ matrix.index }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
