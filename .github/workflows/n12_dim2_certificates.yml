name: Verify algebraic phase certificates in the N12 plane
on:
  push:
    branches: [codex/n12-mixed-quartic]
    paths:
      - '.github/workflows/n12_dim2_certificates.yml'
      - 'research_updates/2026_11_09_n12_mixed/lower_dim_v2_residual_certificates.py'
      - 'research_updates/2026_11_09_n12_mixed/lower-dim-v2-residual-certificates.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research_updates/2026_11_09_n12_mixed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct map supports and orbits
        run: |
          mkdir inputs
          python3 -u lower_dim_support.py --space 3 --output inputs/support.json
          python3 -u lower_dim_orbits.py --space 3 --supports inputs/support.bin --output inputs/orbits.json
      - name: Check the 37 certificates and cross-check the positive counts
        run: |
          python3 -u lower_dim_v2_residual_certificates.py --artifacts inputs --verify
          python3 -u check_counts.py --artifacts inputs --manifest lower-dim-v2-residual-certificates.json
