name: H16 Step 59C Full-389 U1_Perp Shatter & CaDiCaL Algebraic Probe

on:
  workflow_dispatch:

jobs:
  step59c_alg389:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and python-sat
        run: pip install numpy python-sat
      - name: Run Step 59C Algebraic 389 Probe (${{ matrix.cell }})
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP59C_ALGEBRAIC_389_AND_BLOCKB.py --cell ${{ matrix.cell }}
