name: V3 counting foundations
on:
  push:
    branches: [v3-independent-ea-audit-20261008]
    paths:
      - 'pesquisa_v2_quartic/lean/V3CountingFoundations.lean'
      - '.github/workflows/v3-counting-foundations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  counting:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pesquisa_v2_quartic/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Check counting theorem
        run: lake env lean V3CountingFoundations.lean
