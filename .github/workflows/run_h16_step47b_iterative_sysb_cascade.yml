name: H(16,4) Step 47B — Iterative SysB + V0 + NT0_Polar + K_R Cascade

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP47B_ITERATIVE_SYSB_CASCADE.py'
      - '.github/workflows/run_h16_step47b_iterative_sysb_cascade.yml'
  workflow_dispatch:

jobs:
  step47b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [ "B1_11", "B0_11", "B0_00_hard" ]
    name: step47b (${{ matrix.mode }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NumPy
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run Step 47B Iterative SysB Cascade (${{ matrix.mode }})
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP47B_ITERATIVE_SYSB_CASCADE.py --mode "${{ matrix.mode }}"
