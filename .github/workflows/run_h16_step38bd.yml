name: H(16,4) Step 38B-v2 + 38D — B0_00 Z_16* Orbit Map & B1_11/B0_11 New Eqs + Z_16* Loci

on:
  push:
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP38B_V2_B000_Z16_ORBIT_MAP.py'
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP38D_NUCLEAR_NEW_EQS_AND_Z16_LOCUS.py'
      - '.github/workflows/run_h16_step38bd.yml'
  workflow_dispatch:

jobs:
  step38b_v2_b000:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install numpy python-sat
      - name: Run Step 38B-v2 B0_00 Z_16* Orbit Map
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP38B_V2_B000_Z16_ORBIT_MAP.py

  step38d_new_eqs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: [B1_11, B0_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install numpy python-sat
      - name: Run Step 38D (${{ matrix.cell }})
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP38D_NUCLEAR_NEW_EQS_AND_Z16_LOCUS.py --cells ${{ matrix.cell }}
