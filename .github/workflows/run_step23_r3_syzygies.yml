name: Run H16 Step 23 Extract All 318/43 R^3-Cancelling Syzygies & Mutant Cascade

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP23*.py'
      - '.github/workflows/run_step23_r3_syzygies.yml'
  workflow_dispatch:

jobs:
  step23-r3-syzygies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_00, B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install -q python-sat numpy
      - name: Run Step 23 Extract All R^3-Cancelling Syzygies on ${{ matrix.cell }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP23_EXTRACT_318_R3_SYZYGIES.py --cells ${{ matrix.cell }}
