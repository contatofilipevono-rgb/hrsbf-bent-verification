name: H16 Step 58A Bit-Sliced C Fiber Closer Benchmark

on:
  workflow_dispatch:

jobs:
  step58a_bitsliced:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and python-sat
        run: pip install numpy python-sat
      - name: Run Step 58A Bit-Sliced C Fiber Closer Benchmark (${{ matrix.cell }})
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP58A_AVX2_BITSLICED_CLOSER_BENCH.py --cell ${{ matrix.cell }}
