name: H16 Step 28 targeted closure
on:
  push:
    branches: [codex/h16-step28-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eta-symmetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP28A_B000_ETA1.py --multipliers
      - uses: actions/upload-artifact@v4
        with:
          name: h16-step34-b000-multipliers
          path: research_updates/2026_11_17_h16_c99_carbon_hard/step34_b000_multipliers.json
