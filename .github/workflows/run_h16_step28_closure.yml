name: H16 Step 28 targeted closure
on:
  push:
    branches: [codex/h16-step28-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b000-eta0:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP28A_B000_ETA1.py --eta 0 --shard ${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h16-step30-b000-eta0-${{ matrix.shard }}
          path: research_updates/2026_11_17_h16_c99_carbon_hard/step30_b000_eta0_${{ matrix.shard }}.json

  b111-coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP28B_COVERAGE.py --cells B1_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h16-step28-b111-eta0
          path: step28_B1_11_eta0_*.json
