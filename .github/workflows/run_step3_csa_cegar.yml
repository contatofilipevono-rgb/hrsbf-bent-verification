name: Run H16 c99=1 Step 3C (CSA + Cube-and-Conquer + CEGAR)

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_CSA_CEGAR.py'
      - '.github/workflows/run_step3_csa_cegar.yml'
  workflow_dispatch:

jobs:
  step3-csa-cegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat
        run: pip install python-sat
      - name: Run SOLVE_C99_1_CSA_CEGAR.py
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_C99_1_CSA_CEGAR.py
      - name: Upload Step 3C report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h16-c99-step3-csa-cegar
          path: research_updates/2026_11_17_h16_c99_carbon_hard/csa_cegar_c99_1_report.json
