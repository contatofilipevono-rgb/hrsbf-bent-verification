name: H16 B0_00 K0 leaf 199 algebraic replay

on:
  push:
    branches: ['cert/k0-proved-extra-closed']
    paths:
      - '.github/workflows/h16_b000_k0_wess199.yml'
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B000_K0_WESS_REPLAY.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wess:
    name: Algebraic replay W=${{ matrix.w }}
    strategy:
      fail-fast: false
      matrix:
        w: [775, 2495]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shared algebraic engine dependencies
        run: python -m pip install --quiet numpy python-sat
      - name: Run and replay the certificate if closed
        env:
          W: ${{ matrix.w }}
        run: |
          driver=research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B000_K0_WESS_REPLAY.py
          python -u "$driver" --eta 1 --rb 199 --w "$W" --depth 3 --seconds 960 --out "wess-$W.json"
          if python -c 'import json,sys; sys.exit(bool(json.load(open(sys.argv[1]))["open_survivors"]))' "wess-$W.json"; then
            python -u "$driver" --eta 1 --rb 199 --w "$W" --depth 3 --seconds 960 --out "replayed-$W.json" --verify "wess-$W.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k0-rb199-wess-w${{ matrix.w }}
          path: |
            wess-*.json
            replayed-*.json
