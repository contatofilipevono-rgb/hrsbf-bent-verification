name: H(16,4) Step 44A — Full Polar Tower Pareto Sweep (B0_11, B1_11) & Eta=(1,4,5) Polar Audit

on:
  push:
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP44A_ITERATED_POLAR_TOWER.py'
      - '.github/workflows/run_h16_step44a_polar_tower.yml'
  workflow_dispatch:

jobs:
  step44a_polar_tower:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install numpy python-sat
      - name: Run Step 44A Full Polar Tower (${{ matrix.cell }})
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP44A_ITERATED_POLAR_TOWER.py --cells ${{ matrix.cell }}
