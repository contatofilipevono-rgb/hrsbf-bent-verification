name: H16 Step 56B Full-405 Ideal Census + MinRank-XL + SAT

on:
  workflow_dispatch:

jobs:
  step56b_full405:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and python-sat
        run: pip install numpy python-sat
      - name: Run Step 56B Full-405 Ideal Census + MinRank-XL + SAT (${{ matrix.cell }})
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP56B_FULL405_MINRANK_AND_SAT.py --cell ${{ matrix.cell }}
