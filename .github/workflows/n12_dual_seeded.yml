name: Complete 97 quintic charts located through quartic duals

on:
  push:
    branches: [codex/n12-dual-seeded]
    paths:
      - '.github/workflows/n12_dual_seeded.yml'
      - 'research_updates/2026_11_09_n12_mixed/two_quintic_complete.py'
      - 'research_updates/2026_11_09_n12_mixed/complete_sparse_fast.py'
      - 'research_updates/2026_11_09_n12_mixed/sparse_lower.cpp'

permissions:
  contents: read

env:
  SRC: research_updates/2026_11_09_n12_mixed

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        worker: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research_updates/2026_11_09_n12_mixed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install numpy==2.2.6
      - name: Compile and complete each assigned high part
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          g++ -std=c++20 -O3 -march=native -Wall -Wextra -Werror "$SRC/sparse_lower.cpp" -o higher_lower
          python "$SRC/two_quintic_complete.py" "$SRC/dual-quintic-complete-plan.json" "$WORKER" ./higher_lower result --mod8 --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n12-dual-seeded-${{ matrix.worker }}
          path: result/
          if-no-files-found: error
