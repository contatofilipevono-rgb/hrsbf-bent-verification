name: H16 Step 54A Affine & Non-Coordinate 11/12-Dim Mod-8 Cubics

on:
  workflow_dispatch:

jobs:
  step54a_affine_cg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and python-sat
        run: pip install numpy python-sat
      - name: Run Step 54A Affine & Non-Coordinate 11/12-Dim Mod-8 Cubics (${{ matrix.cell }})
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP54A_AFFINE_NONCOORD_CG11_12.py --cell ${{ matrix.cell }}
