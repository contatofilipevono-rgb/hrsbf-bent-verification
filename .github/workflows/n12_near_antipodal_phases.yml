name: Audit near-antipodal quartic phases

on:
  push:
    branches: [codex/n12-mixed-quartic]
    paths:
      - '.github/workflows/n12_near_antipodal_phases.yml'
      - 'research_updates/2026_11_09_n12_mixed/CountNearAntipodal.cs'
      - 'research_updates/2026_11_09_n12_mixed/count_near_antipodal.py'
      - 'research_updates/2026_11_09_n12_mixed/analyse_near_antipodal_phases.py'
      - 'research_updates/2026_11_09_n12_mixed/near_antipodal_field.py'
      - 'research_updates/2026_11_09_n12_mixed/construct_near_antipodal_field.py'
      - 'research_updates/2026_11_09_n12_mixed/certify_near_antipodal_field.py'
      - 'research_updates/2026_11_09_n12_mixed/compare_fable_psi.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research_updates/2026_11_09_n12_mixed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research_updates/2026_11_09_n12_mixed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate plane partitions and audit phases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase-audit | Out-Null
          python count_near_antipodal.py phase-audit/plan.json --export branches.bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /unsafe /optimize+ /out:CountNearAntipodal.exe CountNearAntipodal.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\CountNearAntipodal.exe branches.bin phase-audit/witnesses.txt phase-audit/plane-maps.bin | Tee-Object phase-audit/counts.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python count_near_antipodal.py --verify-witnesses phase-audit/witnesses.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python analyse_near_antipodal_phases.py branches.bin phase-audit/plane-maps.bin phase-audit/phase-analysis.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import json; from pathlib import Path; assert json.loads(Path('phase-audit/phase-analysis.json').read_text()) == json.loads(Path('near-antipodal-phase-analysis.json').read_text())"
      - name: Certify and construct the families over F4
        shell: pwsh
        run: |
          python certify_near_antipodal_field.py phase-audit/field-identities.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python construct_near_antipodal_field.py phase-audit/field-counts.json --compare-planes phase-audit/plane-maps.bin --witnesses phase-audit/field-witnesses.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python count_near_antipodal.py --verify-witnesses phase-audit/field-witnesses.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Match the 72 psi functions and the 6, 20, 24 phase counts
        shell: pwsh
        run: |
          python compare_fable_psi.py phase-audit/fable-comparison.json --compare-planes phase-audit/plane-maps.bin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: n12-near-antipodal-phases
          path: research_updates/2026_11_09_n12_mixed/phase-audit/
          if-no-files-found: error
