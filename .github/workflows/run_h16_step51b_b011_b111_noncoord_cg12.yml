name: H(16,4) Step 51B — B0_11 & B1_11 Non-Coordinate V12 CG12 Degree-3 Probe

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP51B_B011_B111_NONCOORD_CG12_PROBE.py'
      - '.github/workflows/run_h16_step51b_b011_b111_noncoord_cg12.yml'
  workflow_dispatch:

jobs:
  step51b:
    name: step51b (${{ matrix.cell }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP51B_B011_B111_NONCOORD_CG12_PROBE.py --cell ${{ matrix.cell }}
