name: Count phases in the remaining antipodal dimensions
on:
  push:
    branches: [codex/n12-mixed-quartic]
    paths:
      - '.github/workflows/n12_lower_dim_phases.yml'
      - 'research_updates/2026_11_09_n12_mixed/lower_dim_phase_prepare.py'
      - 'research_updates/2026_11_09_n12_mixed/lower_dim_phase_count.cpp'
      - 'research_updates/2026_11_09_n12_mixed/lower_dim_phase_verify.py'
permissions:
  contents: read
jobs:
  phases:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {space: 1, shard: 0, shards: 8, limit: 0, dimension: 25}
          - {space: 1, shard: 1, shards: 8, limit: 0, dimension: 25}
          - {space: 1, shard: 2, shards: 8, limit: 0, dimension: 25}
          - {space: 1, shard: 3, shards: 8, limit: 0, dimension: 25}
          - {space: 1, shard: 4, shards: 8, limit: 0, dimension: 25}
          - {space: 1, shard: 5, shards: 8, limit: 0, dimension: 25}
          - {space: 1, shard: 6, shards: 8, limit: 0, dimension: 25}
          - {space: 1, shard: 7, shards: 8, limit: 0, dimension: 25}
          - {space: 2, shard: 0, shards: 8, limit: 1024, dimension: 19}
          - {space: 3, shard: 0, shards: 8, limit: 1024, dimension: 19}
    defaults:
      run:
        working-directory: research_updates/2026_11_09_n12_mixed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research_updates/2026_11_09_n12_mixed
      - name: Compile the phase counter
        run: g++ -O3 -march=native -std=c++17 -Wall -Wextra lower_dim_phase_count.cpp -o phase_count
      - name: Build the exact phase tasks
        run: |
          mkdir -p phase-output
          python3 -u lower_dim_support.py --space ${{ matrix.space }} --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --output phase-output/support.json
          extra=()
          if [ "${{ matrix.limit }}" -ne 0 ]; then extra=(--stop "${{ matrix.limit }}"); fi
          python3 -u lower_dim_phase_prepare.py --space ${{ matrix.space }} --supports phase-output/support.bin --output tasks.bin "${extra[@]}"
          cp tasks.json phase-output/tasks.json
      - name: Count and verify the exact phases
        run: |
          ./phase_count tasks.bin phase-output/result ${{ matrix.dimension }}
          python3 -u lower_dim_phase_verify.py --tasks tasks.bin --prefix phase-output/result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lower-dim-phase-${{ matrix.space }}-${{ matrix.shard }}
          path: research_updates/2026_11_09_n12_mixed/phase-output/
          if-no-files-found: error
