name: H16 Step 65B Exact 2^18 Anti-Diagonal Dual h_0xFF & S_0xFF Elimination

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP65B_ANTIDIAG_0XFF_EXACT_DUAL_AND_S_ELIM.py'
      - '.github/workflows/run_h16_step65b_antidiag.yml'

jobs:
  step65b_antidiag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy python-sat
      - name: Run Step 65B Exact 2^18 Anti-Diagonal Dual h_0xFF (${{ matrix.cell }})
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP65B_ANTIDIAG_0XFF_EXACT_DUAL_AND_S_ELIM.py --cell ${{ matrix.cell }}
