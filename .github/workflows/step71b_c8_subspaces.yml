name: Step 71B - All C_8-Invariant 8-Dim Subspaces & Twists -> Exact deg<=3 ANF & IR6 Cascade

on:
  workflow_dispatch:

jobs:
  step71b:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_00, B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy scipy python-sat
      - name: Run Step 71B (${{ matrix.cell }})
        env:
          OMP_NUM_THREADS: "4"
        run: |
          set -o pipefail
          python3 -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP71B_C8_SUBSPACES_EXACT_ANF_AND_CASCADE.py \
            --cell ${{ matrix.cell }} \
            | tee step71b_${{ matrix.cell }}.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step71b-${{ matrix.cell }}-log
          path: step71b_${{ matrix.cell }}.log
