name: H(16,4) Step 41A — Greedy Max-Untouched-Rows Flag & Row-Annihilator Subspaces (B0_11, B1_11)

on:
  push:
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP41A_MAX_UNTOUCHED_FLAG_AND_SINGULAR.py'
      - '.github/workflows/run_h16_step41a_max_untouched.yml'
  workflow_dispatch:

jobs:
  step41a_max_untouched:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install numpy python-sat
      - name: Run Step 41A (${{ matrix.cell }})
        run: |
          python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP41A_MAX_UNTOUCHED_FLAG_AND_SINGULAR.py --cells ${{ matrix.cell }}
