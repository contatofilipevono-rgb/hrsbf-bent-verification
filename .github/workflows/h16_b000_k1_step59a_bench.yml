name: H16 B0_00 K=1 Step 59A AVX2 FES Closer Benchmark (e=11 & e=3)

on:
  workflow_dispatch:
    inputs:
      nt_loop:
        description: "Outer FES nt_loop size"
        required: true
        default: "8"
      bench_blocks:
        description: "Number of benchmark blocks (0 = full shard)"
        required: true
        default: "8"

jobs:
  step59a_bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rep: [11, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install --quiet numpy python-sat
      - name: Run C5-free Step 59A AVX2 FES benchmark on B0_00 K=1 e=${{ matrix.rep }}
        run: |
          OMP_NUM_THREADS=$(nproc) python3 -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_B000_K1_STEP59A_BENCH.py \
            --rep "${{ matrix.rep }}" --nt-loop "${{ inputs.nt_loop }}" \
            --bench-blocks "${{ inputs.bench_blocks }}" \
            --out-json "bench_k1_e${{ matrix.rep }}_s59a.json" | tee "bench_k1_e${{ matrix.rep }}_s59a.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k1-step59a-bench-e${{ matrix.rep }}
          path: |
            bench_k1_e${{ matrix.rep }}_s59a.json
            bench_k1_e${{ matrix.rep }}_s59a.log
