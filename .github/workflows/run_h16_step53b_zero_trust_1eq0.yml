name: H16 Step 53B Zero-Trust 1=0 Anatomy & d1 Sweep

on:
  workflow_dispatch:

jobs:
  step53b_anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: pip install numpy
      - name: Run Step 53B Zero-Trust 1=0 Anatomy (${{ matrix.cell }})
        run: |
          python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP53B_ZERO_TRUST_1EQ0_ANATOMY.py --cell ${{ matrix.cell }}
