name: Run H16 Step 22 B0_00 Formal Eta Closure + CryptoMiniSat5 on A(w)*r = b(w)

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP22*.py'
      - '.github/workflows/run_step22_closure_and_cms5.yml'
  workflow_dispatch:

jobs:
  step22a-b000-formal-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-sat and numpy
        run: pip install -q python-sat numpy
      - name: Run Step 22A B0_00 Formal Closure (eta=62,63,42,1 + eta=0 shatter)
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP22A_B000_ENUM_CLOSE_ETA62_63_42_AND_ETA0.py

  step22b-cms5-rf2xl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: [B0_11, B1_11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptominisat5, python-sat, and numpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptominisat
          which cryptominisat5
          pip install -q python-sat numpy
      - name: Run Step 22B RF=2 XL + CryptoMiniSat5 on ${{ matrix.cell }}
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP22B_CRYPTOMINISAT5_AND_RF2_XL.py --cells ${{ matrix.cell }}
