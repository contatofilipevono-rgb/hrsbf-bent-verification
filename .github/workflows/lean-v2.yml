name: Lean V2 verification

on:
  push:
    branches:
      - v2-quartic-mm-index-2026-10-07
    paths:
      - 'pesquisa_v2_quartic/lean/**'
      - '.github/workflows/lean-v2.yml'
  pull_request:
    paths:
      - 'pesquisa_v2_quartic/lean/**'
      - '.github/workflows/lean-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pesquisa_v2_quartic/lean
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean version
        run: lean --version

      - name: Update dependencies
        run: lake update

      - name: Build formalization
        run: lake build
