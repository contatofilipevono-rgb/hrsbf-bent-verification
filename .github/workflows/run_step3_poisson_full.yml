name: Run H16 c99=1 Step 3J (Verify Nullstellensatz Certificate)

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/VERIFY_C99_1_NULLSTELLENSATZ.py'
      - '.github/workflows/run_step3_poisson_full.yml'
  workflow_dispatch:

jobs:
  step3-verify-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run VERIFY_C99_1_NULLSTELLENSATZ.py
        run: python3 research_updates/2026_11_17_h16_c99_carbon_hard/VERIFY_C99_1_NULLSTELLENSATZ.py
