name: H(16,4) Step 53A — B0_11 & B1_11 Linear-Span 1=0 & Reduced-ANF Degree Probe

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP53A_B011_B111_SPAN1EQ0_AND_SAT.py'
      - '.github/workflows/run_h16_step53a_b011_b111_span1eq0.yml'
  workflow_dispatch:

jobs:
  step53a:
    name: step53a (${{ matrix.cell }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP53A_B011_B111_SPAN1EQ0_AND_SAT.py --cell ${{ matrix.cell }}
