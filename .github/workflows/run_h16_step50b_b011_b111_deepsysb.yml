name: H(16,4) Step 50B — B0_11 & B1_11 V8 Subspaces + Deep d1 SysB Cascade

on:
  push:
    branches: [ main ]
    paths:
      - 'research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP50B_B011_B111_DEEP_SYSB_AND_V8.py'
      - '.github/workflows/run_h16_step50b_b011_b111_deepsysb.yml'
  workflow_dispatch:

jobs:
  step50b:
    name: step50b (${{ matrix.cell }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cell: ["B0_11", "B1_11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install numpy python-sat
      - run: python -u research_updates/2026_11_17_h16_c99_carbon_hard/SOLVE_STEP50B_B011_B111_DEEP_SYSB_AND_V8.py --cell ${{ matrix.cell }} --etas 0,1,4,5
